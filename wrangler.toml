[vars]
ALLOWED_ORIGIN = "https://honktavern-guestbook.muddles.net.worker.dev"
TURNSTILE_SITE_KEY = "0x4AAAAAAC-Nngrukiqg-dqQ"
RATE_LIMIT_SECONDS = "5"
