[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "xiv-messagebook"
database_id = "de8148ab-34b7-467d-8225-393148c2b383"
